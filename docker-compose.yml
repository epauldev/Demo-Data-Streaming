version: "3.7"

# Redpanda = broker de messages compatible avec le protocole Kafka,
# beaucoup plus simple à faire tourner en démo (un seul conteneur,
# pas besoin de Zookeeper).
#
# Deux listeners sont déclarés car deux mondes différents doivent
# joindre le broker :
# - "internal" : pour les autres conteneurs Docker (la console web),
#   qui se parlent entre eux via le nom de service "redpanda" ;
# - "external" : pour vos scripts Python lancés sur votre machine hôte,
#   qui doivent passer par "localhost" et un port publié.
# Sans cette distinction, le broker annonce une seule adresse qui ne
# fonctionne que pour l'un des deux mondes (voir le 500 de la console).

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"  # protocole Kafka, accessible depuis l'hôte (nos scripts Python)
      - "18082:18082"  # proxy HTTP (optionnel)
      - "9644:9644"    # métriques admin

  console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    depends_on:
      - redpanda
    environment:
      # La console est un conteneur : elle joint Redpanda via le réseau
      # Docker interne, donc par son nom de service et le port interne.
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"   # UI web : http://localhost:8080
